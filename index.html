<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brew Your Type · SAO Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4EC; --surface:#FFFFFB; --surface-2:#FBF7EC;
  --line:#E6E0D0; --line-2:#D2CAB6;
  --ink:#14140F; --ink-2:#5F5C50; --ink-3:#96917F;
  --green:#1E7A3D; --sage:#8CA37A; --sage-t:#E4EBDB;
  --rose:#E2A9BC; --rose-t:#F9E6EC; --lilac:#C9BEE0;
  --wash-y:#FBEBBF; --wash-b:#D6E6F4; --wash-p:#F7DEE6; --wash-g:#DDE7D5;
  --cinnamon:#A9743C; --citrus:#D3822B; --amber:#C9973A; --cocoa:#7A5230; --red:#C0392B;
  --world:#1E7A3D; --world-t:#E4EBDB; --world-d:#1B4D2C;
  --r:18px; --bar:88px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 10% 6%, rgba(251,235,191,.85), transparent 40%),
    radial-gradient(circle at 90% 12%, rgba(214,230,244,.8), transparent 38%),
    radial-gradient(circle at 82% 72%, rgba(247,222,230,.75), transparent 36%),
    radial-gradient(circle at 8% 80%, rgba(221,231,213,.7), transparent 38%);
  background-repeat:no-repeat;
  background-attachment:fixed;
  color:var(--ink);font-family:"Anuphan",system-ui,sans-serif;font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased}
.sheet{max-width:520px;margin:0 auto;padding:0 18px calc(var(--bar) + 28px)}
header{position:sticky;top:0;z-index:9;background:rgba(247,244,236,.93);
  backdrop-filter:blur(10px);margin:0 -18px;padding:12px 18px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{display:flex;align-items:center;gap:8px}
.dots span{display:inline-block;width:6px;height:6px;border-radius:6px;background:var(--red);margin-right:2px}
.mark b{font-size:14px;font-weight:600;letter-spacing:.16em;color:var(--green)}
.mark i{font-style:normal;font-size:11.5px;color:var(--ink-3)}
.count{border:1px solid var(--line-2);border-radius:9px;padding:2px 10px;font-size:11px;
  color:var(--ink-2);text-align:center;line-height:1.35;background:var(--surface);
  transform:rotate(1.5deg)}
.count b{display:block;font-size:15px;font-weight:700;color:var(--ink)}
.progress{height:4px;background:var(--line);margin:10px 0 0;border-radius:4px;overflow:hidden}
.progress i{display:block;height:4px;background:var(--world);width:0;
  transition:width .45s cubic-bezier(.2,.7,.2,1),background .3s}

.band{position:relative;overflow:hidden;margin:18px -18px 0;padding:24px 18px 26px;
  background:var(--world-t);color:var(--ink)}
.band::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
  border-radius:50%;background:#fff;opacity:.45;filter:blur(24px)}
.band .in{position:relative;z-index:2}
.band .kicker{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--world)}
.band h1{color:var(--ink);margin:8px 0 4px}
.band h2{color:var(--ink);margin:8px 0 4px}
.band p{margin:6px 0 0;font-size:14.5px;color:var(--ink-2);max-width:32ch}
.band .art{position:absolute;z-index:1;opacity:.5;right:-16px;bottom:-22px}
.band .stamp{position:absolute;z-index:3;top:16px;right:16px;border:1.5px solid var(--world);
  border-radius:999px;padding:5px 12px;font-size:11.5px;transform:rotate(6deg);
  color:var(--world);background:rgba(255,255,255,.6)}

.tag{display:inline-flex;align-items:center;gap:7px;background:var(--wash-y);color:var(--ink);
  font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 13px;border-radius:8px;margin:24px 0 10px}
.tag.world{background:var(--world-t);color:var(--ink)}
.tag.plain{background:transparent;color:var(--ink-3);border:1px dashed var(--line-2);letter-spacing:.06em}
h1{font-size:37px;line-height:1.14;letter-spacing:-.025em;font-weight:700;margin:0 0 8px}
h2{font-size:25px;line-height:1.3;letter-spacing:-.018em;font-weight:600;margin:0 0 8px}
.lead{font-size:15.5px;color:var(--ink-2);margin:0 0 20px;max-width:38ch}
.big{font-size:70px;line-height:1;letter-spacing:-.045em;font-weight:700;color:var(--world)}
.divider{display:flex;align-items:center;gap:10px;margin:26px 0 4px;color:var(--ink-3)}
.divider::before,.divider::after{content:"";flex:1;height:1px;
  background:repeating-linear-gradient(90deg,var(--line-2) 0 5px,transparent 5px 10px)}

input[type=text]{width:100%;padding:15px 16px;border:1.5px solid var(--line-2);border-radius:13px;
  background:var(--surface);color:var(--ink);font-family:inherit;font-size:17px;transition:border-color .15s}
input[type=text]:focus{border-color:var(--world);outline:none}
input::placeholder{color:var(--ink-3)}
button:focus-visible,input:focus-visible{outline:2px solid var(--world);outline-offset:2px}

.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:right;padding:14px 15px;
  margin-top:10px;border:1.5px solid var(--line);border-radius:15px;background:var(--surface);
  color:var(--ink);font-family:inherit;font-size:16px;line-height:1.5;cursor:pointer;
  transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.99)}
.opt .txt{flex:1}
.opt .tick{width:20px;height:20px;border-radius:20px;border:1.5px solid var(--line-2);flex:none;
  display:grid;place-items:center;transition:.15s}
.opt .tick::after{content:"";width:9px;height:9px;border-radius:9px;background:transparent;transition:.15s}
.opt[aria-pressed=true]{border-color:var(--world);background:var(--world-t)}
.opt[aria-pressed=true] .tick{border-color:var(--world)}
.opt[aria-pressed=true] .tick::after{background:var(--world)}
.opt.right{border-color:var(--sage);background:var(--sage-t)}
.opt.wrong{border-color:#E0BEC5;background:var(--rose-t);color:#8E5265}
.ic{width:26px;height:26px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.grid2 .opt{margin-top:0;padding:13px 11px;font-size:15px;gap:9px}
.grid2 .opt .tick{display:none}
.legend{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);
  background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.legend i{width:9px;height:9px;border-radius:9px;display:inline-block}

.card{position:relative;overflow:hidden;background:var(--surface);border:1.5px solid var(--line);
  border-radius:var(--r);padding:18px 20px;margin-top:16px}
.card.tinted{background:var(--world-t);border-color:var(--world)}
.card h3{font-size:17px;font-weight:600;margin:0 0 2px}
.card .sub{font-size:14px;color:var(--ink-2);margin:0}
.card .corner{position:absolute;right:-10px;top:-10px;opacity:.35;pointer-events:none}
.rows{margin-top:14px;position:relative;z-index:2}
.rows div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;font-size:15px;
  border-top:1px dashed var(--line-2)}
.rows div:first-child{border-top:0;padding-top:2px}
.rows span:first-child{color:var(--ink-3);flex:none;display:inline-flex;align-items:center;gap:7px}
.rows span:last-child{text-align:left;font-weight:500}
.meter{margin-top:14px}
.meter div{display:flex;align-items:center;gap:10px;margin-top:9px;font-size:13.5px;color:var(--ink-2)}
.meter b{flex:none;width:74px;font-weight:500}
.meter u{flex:1;height:7px;border-radius:7px;background:var(--line);text-decoration:none;overflow:hidden}
.meter u i{display:block;height:7px;background:var(--world);border-radius:7px}
.chip{display:inline-block;margin:0 8px 8px 0;padding:8px 15px;border:1.5px solid var(--line-2);
  border-radius:999px;background:var(--surface);font-family:inherit;font-size:14.5px;
  color:var(--ink-2);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--world);color:var(--world);background:var(--world-t)}
.wheelwrap{position:relative;display:grid;place-items:center;margin-top:16px;
  padding:10px 0 4px}
.wheelwrap svg.wheel{width:min(290px,74vw);height:auto;overflow:visible;
  filter:drop-shadow(0 6px 14px rgba(25,26,18,.14))}
.pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);z-index:4}
#wheelG{transform-box:fill-box;transform-origin:center;
  transition:transform 4.2s cubic-bezier(.13,.72,.14,1)}
.wheelwrap.fast #wheelG{transition:none}
.hubtxt{font-family:"Anuphan",sans-serif;font-weight:700}
.result{margin-top:14px;text-align:center;font-size:26px;font-weight:700;letter-spacing:-.02em;
  min-height:38px}
.result small{display:block;font-size:13px;font-weight:400;color:var(--ink-3);letter-spacing:0}
@media (prefers-reduced-motion:reduce){#wheelG{transition:none}}
.slot{position:relative;overflow:hidden;display:grid;place-items:center;min-height:138px;
  margin-top:12px;padding:24px 16px;border:1.5px dashed var(--line-2);border-radius:var(--r);
  background:var(--surface-2);font-size:27px;font-weight:700;letter-spacing:-.02em;text-align:center}
.slot .art{position:absolute;opacity:.22;left:-18px;bottom:-18px}
.slot.rolling{color:var(--ink-3);filter:blur(.5px)}
@media (prefers-reduced-motion:reduce){.slot.rolling{filter:none}.progress i{transition:none}}
.link{display:block;width:100%;margin-top:12px;padding:13px;border:1.5px solid var(--line-2);
  border-radius:12px;background:var(--surface);color:var(--ink);font-family:inherit;
  font-size:15px;font-weight:600;cursor:pointer}
.hero{position:relative;overflow:hidden;background:var(--world-d);color:#FBF8EE;
  border-radius:24px;padding:26px 22px;margin-top:16px}
.hero::after{content:"";position:absolute;inset:0;opacity:.13;
  background:repeating-linear-gradient(135deg,#fff 0 1px,transparent 1px 11px)}
.hero>*{position:relative;z-index:2}
.hero .art{position:absolute;z-index:1;opacity:.4;right:-24px;top:-16px}
.hero .art2{position:absolute;z-index:1;opacity:.3;left:-22px;bottom:-26px}
.hero .no{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.hero h2{color:#FFFDF6;margin:12px 0 4px;font-size:32px}
.hero .sub{font-size:14.5px;margin:0;opacity:.8}
.hero .rows div{border-top-color:rgba(255,255,255,.2)}
.hero .rows span:first-child{color:rgba(255,255,255,.62)}
.hero .rows span:last-child{color:#FBF8EE}
.hero .seal{display:inline-block;margin-top:18px;padding:7px 15px;border-radius:999px;
  border:1.5px solid rgba(255,255,255,.45);font-size:13px;transform:rotate(-1.5deg)}
.bandimg{position:absolute;right:-6px;bottom:-6px;width:150px;height:auto;z-index:1;
  border-radius:14px;box-shadow:0 6px 16px rgba(20,20,15,.18)}
.cornimg{position:absolute;right:12px;bottom:10px;width:92px;height:auto;border-radius:10px;z-index:3;
  box-shadow:0 4px 12px rgba(20,20,15,.16)}
.coverfull{display:block;width:100%;max-width:400px;margin:16px auto 0;height:auto;border-radius:16px}
.coverimg{width:100%;border-radius:16px;margin-top:14px;display:block}
.imgrow{display:flex;align-items:center;gap:12px;margin-top:10px}
.imgrow img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.imgrow .none{width:56px;height:56px;border-radius:10px;border:1.5px dashed var(--line-2);
  display:grid;place-items:center;font-size:11px;color:var(--ink-3)}
.imgrow button{padding:9px 14px;border-radius:10px;border:1.5px solid var(--line-2);background:var(--surface);
  font-family:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.admin{position:fixed;inset:0;z-index:20;background:rgba(20,20,15,.55);backdrop-filter:blur(4px);
  display:none;overflow-y:auto;padding:24px 16px 60px}
.admin.on{display:block}
.adminbox{max-width:520px;margin:0 auto;background:var(--surface);border:1.5px solid var(--line);
  border-radius:18px;padding:20px}
.adminbox h3{font-size:20px;font-weight:700;margin:0 0 4px}
.adminbox p.sub{font-size:13.5px;color:var(--ink-2);margin:0 0 14px}
.adminbox label{display:block;font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);margin:16px 0 6px}
.adminbox textarea,.adminbox input{width:100%;padding:11px 13px;border:1.5px solid var(--line-2);
  border-radius:11px;background:var(--surface-2);color:var(--ink);font-family:inherit;font-size:15px;line-height:1.6}
.adminbox textarea{min-height:96px;resize:vertical}
.adminrow{display:flex;gap:10px;margin-top:18px}
.adminrow button{flex:1;padding:14px;border-radius:12px;border:0;font-family:inherit;font-size:15.5px;
  font-weight:600;cursor:pointer}
.adminrow .save{background:var(--green);color:#FBF8EE}
.adminrow .close{background:var(--line);color:var(--ink)}
.adminrow .reset{background:transparent;border:1.5px solid var(--line-2);color:var(--ink-2)}
.adminnote{font-size:12.5px;color:var(--ink-3);margin-top:12px;line-height:1.7}
.photoslot{position:relative;z-index:3;margin:0 0 18px;border-radius:16px;overflow:hidden;
  aspect-ratio:4/5;display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.10);border:1.5px dashed rgba(255,255,255,.45)}
.photoslot.has{border:8px solid #14140F;border-style:solid;background:#14140F;
  box-shadow:0 6px 18px rgba(0,0,0,.35)}
.photoslot img{width:100%;height:100%;object-fit:cover;display:block;border-radius:9px}
.photoslot .ph{text-align:center;padding:22px;font-size:14.5px;line-height:1.7;color:rgba(251,248,238,.85)}
.photoslot .ph svg{width:26px;height:26px;display:block;margin:0 auto 8px}
.photoslot .swap{position:absolute;right:10px;bottom:10px;background:rgba(20,20,15,.6);
  color:#FBF8EE;font-size:12.5px;padding:6px 12px;border-radius:999px;backdrop-filter:blur(6px)}
.photobox{margin-top:16px}
.photobox input[type=file]{display:none}
.shot{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;
  border:1.5px dashed var(--line-2);border-radius:14px;background:var(--surface);
  color:var(--ink);font-family:inherit;font-size:15.5px;font-weight:600;cursor:pointer}
.shot svg{width:20px;height:20px}
.pcwrap{margin-top:14px;display:none}
.pcwrap.on{display:block}
.pcwrap img{width:100%;border-radius:16px;border:1.5px solid var(--line);display:block}
.pchint{font-size:12.5px;color:var(--ink-3);margin-top:10px;text-align:center;line-height:1.6}
.note{font-size:13.5px;color:var(--ink-3);margin-top:16px;line-height:1.75}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(247,244,236,.96);
  backdrop-filter:blur(12px);border-top:1.5px solid var(--line);
  padding:13px 18px calc(13px + env(safe-area-inset-bottom))}
.bar .inner{max-width:520px;margin:0 auto}
.bar button{width:100%;padding:17px;border:0;border-radius:14px;background:var(--world);
  color:#FBF8EE;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;
  transition:transform .12s,background .2s;box-shadow:0 4px 0 rgba(25,26,18,.16)}
.bar button:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(25,26,18,.16)}
.bar button[disabled]{background:var(--line-2);color:#fff;box-shadow:none;cursor:not-allowed}
.bar.hidden{display:none}
footer{margin-top:30px;padding-top:16px;border-top:1px dashed var(--line-2);
  font-size:12.5px;color:var(--ink-3);line-height:1.9}
</style>
</head>
<body>

<script>
const CAT = {
  floral:{c:"#C77E92",l:"ดอกไม้",i:"ic-flower"},
  citrus:{c:"#D3822B",l:"สดชื่น",i:"ic-citrus"},
  herbal:{c:"#6E8B5A",l:"สมุนไพร",i:"ic-leaf"},
  spiced:{c:"#A96B33",l:"เครื่องเทศ",i:"ic-anise"},
  sweet:{c:"#C9A24A",l:"หวานผลไม้",i:"ic-drop"},
  gourmand:{c:"#7A5230",l:"กาแฟ & โกโก้",i:"ic-bean"}
};

const subKey = (code,name) => code + "::" + name;
function allSubs(){
  const out = [];
  ["NT","NF","SJ","SP"].forEach(code => {
    (WORLDS[code].groups || []).forEach(g => { if(g.name) out.push({code, name:g.name, key:subKey(code,g.name)}); });
  });
  return out;
}
function parseWorld(text){
  const groups = []; let plain = [];
  parseLines(text).forEach(ln => {
    const i = ln.indexOf(":");
    if(i > 0){
      const name = ln.slice(0,i).trim();
      const items = ln.slice(i+1).split(/[,·]/).map(x => x.trim()).filter(Boolean);
      if(items.length) groups.push({name, items});
    } else plain.push(ln);
  });
  if(plain.length) groups.unshift({name:"", items:plain});
  const base = groups.reduce((a,g) => a.concat(g.items), []);
  return {base, groups};
}
function fileToDataURL(file, maxW){
  return new Promise((res,rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const sc = Math.min(1, maxW/im.width);
        const cv = document.createElement("canvas");
        cv.width = Math.round(im.width*sc); cv.height = Math.round(im.height*sc);
        cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
        res(cv.toDataURL("image/jpeg", .82));
      };
      im.onerror = rej; im.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}
let CFG = JSON.parse(JSON.stringify(DEFAULTS));
const CFG_KEY = "byt-config-v1";
async function loadCFG(){
  let remote = null, local = null;
  try{
    const r = await fetch("config.json?v=" + Date.now(), {cache:"no-store"});
    if(r.ok) remote = await r.json();
  }catch(e){}
  try{
    const raw = localStorage.getItem(CFG_KEY);
    if(raw) local = JSON.parse(raw);
  }catch(e){}
  CFG = Object.assign(JSON.parse(JSON.stringify(DEFAULTS)), remote || {}, local || {});
  CFG.img = Object.assign({}, DEFAULTS.img, (remote && remote.img) || {}, (local && local.img) || {});
  if(remote && remote.worldsText) CFG.worldsText = Object.assign({}, remote.worldsText, (local && local.worldsText) || {});
  CFG.hasRemote = !!remote;
  CFG.hasLocal = !!local;
  applyCFG();
  render();
}
function exportCFG(){
  const out = JSON.parse(JSON.stringify(CFG));
  delete out.hasRemote; delete out.hasLocal;
  const blob = new Blob([JSON.stringify(out, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "config.json";
  a.click();
}
function clearLocal(){
  try{ localStorage.removeItem(CFG_KEY); }catch(e){}
  location.reload();
}
function saveCFG(){
  try{ localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); return true; }catch(e){ return false; }
}
function applyCFG(){
  if(!CFG.img) CFG.img = JSON.parse(JSON.stringify(DEFAULTS.img));
  if(!CFG.worldsText) CFG.worldsText = {};
  ["NT","NF","SJ","SP"].forEach(k => {
    const txt = (CFG.worldsText && CFG.worldsText[k]) || lines(CFG.worlds[k] || []);
    const pw = parseWorld(txt);
    if(pw.base.length){ WORLDS[k].base = pw.base; WORLDS[k].groups = pw.groups; }
    CFG.worldsText[k] = txt;
  });
  TOUCH = CFG.touch; POOL = CFG.pool; TOPPINGS = CFG.toppings; TEA_BASE = CFG.teabase;
  SMELL = CFG.smell.map((ans,i) => {
    const others = Object.keys(ING).filter(n => n !== ans);
    const picks = [];
    while(picks.length < 3 && others.length){ picks.push(others.splice(Math.floor(Math.random()*others.length),1)[0]); }
    const opts = [ans, ...picks].sort(() => Math.random()-.5);
    return {n:i+1, ans, opts};
  });
  const mk = document.querySelector(".mark");
  if(mk && CFG.img.logo && !mk.dataset.custom){
    mk.dataset.custom = "1";
    mk.innerHTML = `<img src="${CFG.img.logo}" alt="SAO CAFÉ" style="height:30px;width:auto;border-radius:6px">`;
    bindAdminTap();
  }
  const f = document.querySelector("footer");
  if(f) f.innerHTML = `บริษัท ไชยจันลา จำกัด · RANGSAN Academy · SAO Café · RANGSAN Coffee<br>
    จองรอบถัดไป LINE ${esc(CFG.line)} · IG ${esc(CFG.ig)}`;
}

function bindAdminTap(){
  const m = document.querySelector(".mark");

  m.onclick = () => {
    const now = Date.now();

  };
}

function vQuiz(){
  const q = Q[S.qi];
  app.innerHTML = `
    <span class="tag">What's your type · ${pad(S.qi+1)} / ${pad(Q.length)}</span>
    <h2>${esc(q.t)}</h2>
    <p class="lead">ตอบตามที่เป็นจริง ไม่ต้องคิดนาน</p>
    ${q.o.map((o,i)=>`<button class="opt" data-i="${i}"><span class="txt">${esc(o[2])}</span><span class="tick"></span></button>`).join("")}
    ${S.qi>0?'<button class="link" id="back">ย้อนกลับ</button>':""}
    <div class="divider">ตอบครบ ${Q.length} ข้อแล้วรู้กลุ่มกลิ่นทันที</div>`;
  bar(null);
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    S.ans[S.qi] = [q.o[+b.dataset.i][0], q.o[+b.dataset.i][1]];
    b.setAttribute("aria-pressed","true");
    setTimeout(() => {
      if(S.qi < Q.length-1){ S.qi++; render(); }
      else { S.type = tally(); S.picks=[]; S.touch=""; S.forced=""; S.rerolled=false; go("world"); }
    }, 150);
  });
  const bk = document.getElementById("back");
  if(bk) bk.onclick = () => { S.qi--; render(); };
}
function tally(){
  const c = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  S.ans.forEach(a => { if(a) c[a[0]] += a[1]; });
  S.counts = c;
  return (c.E>=c.I?"E":"I")+(c.S>=c.N?"S":"N")+(c.T>=c.F?"T":"F")+(c.J>=c.P?"J":"P");
}

const AXES = [["E","I"],["S","N"],["T","F"],["J","P"]];
function axisCard(){
  const c = S.counts || {};
  return AXES.map(([a,b]) => {
    const ca = c[a]||0, cb = c[b]||0, tot = ca+cb || 1;
    const win = ca>=cb ? a : b, pct = Math.round(Math.max(ca,cb)/tot*100);
    return `<div><b>${a} / ${b}</b><u><i style="width:${pct}%"></i></u>
      <span style="flex:none;width:64px;text-align:left">${win} ${pct}%</span></div>`;
  }).join("");
}

const TEA_COLORS = ["#7A4A1E","#C77E92","#6E8B5A","#D3822B","#A99BC8","#C9A24A"];
let wheelAngle = 0;

function polar(r, deg){
  const a = (deg-90) * Math.PI/180;
  return [100 + r*Math.cos(a), 100 + r*Math.sin(a)];
}
function wheelHTML(items, colors){
  const n = items.length, seg = 360/n;
  const sectors = items.map((it,i) => {
    const c = colors ? colors[i%colors.length] : cat(it).c;
    const [x1,y1] = polar(92, i*seg), [x2,y2] = polar(92, (i+1)*seg);
    const mid = i*seg + seg/2, [lx,ly] = polar(60, mid);
    const fs = it.length > 10 ? 7.4 : it.length > 7 ? 8.4 : 9.6;
    return `<path d="M100 100 L${x1.toFixed(1)} ${y1.toFixed(1)} A92 92 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z"
      fill="${c}" stroke="#FFFDF6" stroke-width="1.5"/>
      <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" fill="#FFFDF6" font-size="${fs}"
        text-anchor="middle" dominant-baseline="middle" class="hubtxt"
        transform="rotate(${mid.toFixed(1)} ${lx.toFixed(1)} ${ly.toFixed(1)})">${esc(it)}</text>`;
  }).join("");
  return `<div class="wheelwrap" id="wheelwrap">
    <svg class="pointer" width="30" height="26" viewBox="0 0 30 26" aria-hidden="true">
      <path d="M15 25 L3 3 A1 1 0 0 1 27 3 Z" fill="var(--world)" stroke="#FFFDF6" stroke-width="2"/>
    </svg>
    <svg class="wheel" viewBox="0 0 200 200" role="img" aria-label="วงล้อสุ่ม">
      <circle cx="100" cy="100" r="96" fill="#FFFDF6" stroke="var(--line-2)" stroke-width="2"/>
      <g id="wheelG">${sectors}</g>
      <circle cx="100" cy="100" r="17" fill="#FFFDF6" stroke="var(--world)" stroke-width="2.5"/>
      <circle cx="100" cy="100" r="6" fill="var(--world)"/>
    </svg>
  </div>
  <div class="result" id="result"></div>`;
}
function spinWheel(items, done){
  const g = document.getElementById("wheelG");
  const res = document.getElementById("result");
  const wrap = document.getElementById("wheelwrap");
  const n = items.length, seg = 360/n;
  const idx = Math.floor(Math.random()*n);
  const target = 360*5 + (360 - (idx*seg + seg/2));
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  res.innerHTML = "";
  wheelAngle += target;
  if(reduced){
    wrap.classList.add("fast");
    g.style.transform = `rotate(${wheelAngle}deg)`;
    finish();
    return;
  }
  wrap.classList.remove("fast");
  requestAnimationFrame(() => { g.style.transform = `rotate(${wheelAngle}deg)`; });
  let called = false;
  const finishOnce = () => { if(!called){ called = true; finish(); } };
  g.addEventListener("transitionend", finishOnce, {once:true});
  setTimeout(finishOnce, 4600);
  function finish(){
    const v = items[idx];
    res.innerHTML = `${esc(v)}<small>วงล้อเลือกให้แล้ว</small>`;
    res.style.color = "var(--world)";
    done(v);
  }
}

    <div class="grid2" id="sweet">${SWEET.map(t=>
      `<button class="opt" aria-pressed="${S.sweet===t}" data-v="${esc(t)}"><span class="txt">${esc(t)}</span></button>`).join("")}</div>
    <span class="tag plain">ท็อปปิ้งจากวงล้อ</span>
    ${wheelHTML(TOPPINGS, TEA_COLORS)}
    <button class="link" id="spin">${S.top ? "หมุนใหม่" : "หมุนท็อปปิ้ง"}</button>`;
  const check = () => { cta.disabled = !(S.tea && S.sweet && S.top); };
  bar("สร้างการ์ดสรุป", () => go("card"), true);
  const bind = (sel,key) => app.querySelectorAll(sel+" .opt").forEach(b => b.onclick = () => {
    S[key] = b.dataset.v;
    app.querySelectorAll(sel+" .opt").forEach(o => o.setAttribute("aria-pressed", o===b?"true":"false"));
    check();
  });
  bind("#base","tea"); bind("#sweet","sweet");
  const spin = document.getElementById("spin");
  if(S.top) document.getElementById("result").innerHTML = esc(S.top)+"<small>วงล้อเลือกให้แล้ว</small>";
  spin.onclick = () => {
    spin.disabled = true;
    spinWheel(TOPPINGS, v => {
      S.top = v; spin.disabled = false; spin.textContent = "หมุนใหม่"; check();
    });
  };
  check();
}


const PC_W = 1080, PC_H = 1900;
function rrect(c,x,y,w,hh,r){
  if(c.roundRect){ c.beginPath(); c.roundRect(x,y,w,hh,r); return; }
  c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+hh,r); c.arcTo(x+w,y+hh,x,y+hh,r);
  c.arcTo(x,y+hh,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function wrapLines(c,txt,max,maxLines){
  const words = String(txt).split(/(\s+)/);
  const lines = []; let cur = "";
  for(const w of words){
    const test = cur + w;
    if(c.measureText(test).width > max && cur.trim()){
      lines.push(cur.trim()); cur = w.trim() ? w : "";
      if(lines.length === maxLines-1 && c.measureText(cur).width > max){ }
    } else cur = test;
  }
  if(cur.trim()) lines.push(cur.trim());
  if(lines.length > maxLines){
    const keep = lines.slice(0,maxLines);
    keep[maxLines-1] = keep[maxLines-1].replace(/\s+\S*$/,"") + "…";
    return keep;
  }
  return lines;
}
function fitTxt(c,txt,max){
  if(c.measureText(txt).width <= max) return txt;
  let t = txt;
  while(t.length > 4 && c.measureText(t+"…").width > max) t = t.slice(0,-1);
  return t+"…";
}
function fit(c,txt,max,size,weight){
  let s = size;
  while(s > 18){ c.font = `${weight} ${s}px Anuphan, sans-serif`; if(c.measureText(txt).width <= max) break; s -= 2; }
  return s;
}
async function makePostcard(file){
  const w = worldOf(S.type);
  const cv = document.createElement("canvas");
  cv.width = PC_W; cv.height = PC_H;
  const c = cv.getContext("2d");
  c.fillStyle = "#F7F4EC"; c.fillRect(0,0,PC_W,PC_H);
  if(CFG.img.pcbg){
    try{
      const bg = await new Promise((res,rej) => {
        const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = CFG.img.pcbg;
      });
      const bs = Math.max(PC_W/bg.width, PC_H/bg.height);
      c.drawImage(bg, (PC_W-bg.width*bs)/2, (PC_H-bg.height*bs)/2, bg.width*bs, bg.height*bs);
    }catch(e){}
  }
  c.fillStyle = w.tint; c.fillRect(0,0,PC_W,40);

  let bmp = null;
  try{
    bmp = await createImageBitmap(file, {imageOrientation:"from-image"});
  }catch(e){
    bmp = await new Promise((res,rej) => {
      const im = new Image(); im.onload = () => res(im); im.onerror = rej;
      im.src = URL.createObjectURL(file);
    });
  }
  const px = 60, pw = PC_W - 120;
  const iw = 780, ih = Math.round(iw*5/4), ix = Math.round((PC_W-iw)/2), iy = 60;
  const mx = ix-22, my = iy-22, mw = iw+44, mh = ih+56;
  const base = my + mh;
  const scale = Math.max(iw/bmp.width, ih/bmp.height);
  const dw = bmp.width*scale, dh = bmp.height*scale;
  c.save();
  c.shadowColor = "rgba(20,20,15,.22)"; c.shadowBlur = 26; c.shadowOffsetY = 10;
  c.fillStyle = "#14140F"; rrect(c,mx,my,mw,mh,22); c.fill();
  c.restore();
  c.save(); rrect(c,ix,iy,iw,ih,14); c.clip();
  c.drawImage(bmp, ix + (iw-dw)/2, iy + (ih-dh)/2, dw, dh);
  c.restore();
  c.strokeStyle = "rgba(255,255,255,.22)"; c.lineWidth = 2;
  rrect(c,ix,iy,iw,ih,14); c.stroke();
  c.strokeStyle = "rgba(20,20,15,.35)"; c.lineWidth = 1.5;
  rrect(c,mx,my,mw,mh,22); c.stroke();

  if(CFG.img.pcbg){
    c.fillStyle = "rgba(247,244,236,.94)";
    rrect(c, 34, base+16, PC_W-68, (PC_H-146)-(base+16), 26); c.fill();
  }
  const tp = TYPES[S.type] || {n:"",t:[],d:"",s:""};
  const tw = pw - 230;
  try{
    const ch = await new Promise((res,rej) => {
      const im = new Image(); im.onload = () => res(im); im.onerror = rej;
      im.src = CFG.img[w.code] || charDataURL(w.code);
    });
    if(CFG.img[w.code]){
      const bw = 170, bh = 200, sc = Math.max(bw/ch.width, bh/ch.height);
      const dw = ch.width*sc, dh = ch.height*sc;
      c.save(); rrect(c, PC_W-px-bw, base+130, bw, bh, 16); c.clip();
      c.drawImage(ch, PC_W-px-bw + (bw-dw)/2, base+130 + (bh-dh)/2, dw, dh);
      c.restore();
    } else {
      c.drawImage(ch, PC_W-px-160, base+130, 160, 240);
    }
  }catch(e){}
  c.textAlign = "left"; c.fillStyle = "#96917F";
  c.font = "500 26px Anuphan, sans-serif";
  c.fillText(`${S.serial} · ${new Date().toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"})}`, px, base+52);

  const nameSize = fit(c, S.scent, pw, 66, "700");
  c.fillStyle = "#14140F"; c.font = `700 ${nameSize}px Anuphan, sans-serif`;
  c.fillText(S.scent, px, base+120);

  c.fillStyle = "#5F5C50"; c.font = "500 29px Anuphan, sans-serif";
  c.fillText(fitTxt(c,`โดย ${S.name} · ${S.type} ${tp.n} · ${w.code} — ${w.title}`,tw), px, base+164);

  c.fillStyle = w.color; c.font = "600 27px Anuphan, sans-serif";
  c.fillText(fitTxt(c,`${(tp.t||[]).join(" · ")} · ${w.mood}`,tw), px, base+204);

  c.fillStyle = "#5F5C50"; c.font = "500 26px Anuphan, sans-serif";
  wrapLines(c, tp.d, tw, 3).forEach((ln,i) => c.fillText(ln, px, base+244 + i*36));
  c.fillStyle = "#96917F"; c.font = "italic 500 25px Anuphan, sans-serif";
  wrapLines(c, "ตอนเลือกกลิ่น: " + tp.s, tw, 2).forEach((ln,i) => c.fillText(ln, px, base+322 + i*34));

  const rows = [
    ["กลิ่นฐาน", S.picks.join(" · ")],
    ["เติมเอง", S.touch],
    ["วงล้อ", S.forced],
    ["ชาไทย", `${S.tea} · ${S.sweet}`],
    ["ท็อปปิ้ง", S.top],
    ["เกมทายกลิ่น", `${S.smellScore} / ${SMELL.length}`]
  ];
  let y = base+400;
  rows.forEach(([k,v]) => {
    c.strokeStyle = "#E6E0D0"; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(px,y); c.lineTo(PC_W-px,y); c.stroke();
    c.fillStyle = "#96917F"; c.font = "500 27px Anuphan, sans-serif";
    c.fillText(k, px, y+40);
    c.fillStyle = "#14140F"; c.textAlign = "right";
    const vs = fit(c, v, pw-260, 29, "600");
    c.font = `600 ${vs}px Anuphan, sans-serif`;
    c.fillText(v, PC_W-px, y+40);
    c.textAlign = "left";
    y += 44;
  });

  c.fillStyle = w.deep; c.fillRect(0, PC_H-150, PC_W, 150);
  c.fillStyle = "#FBF8EE"; c.font = "600 32px Anuphan, sans-serif";
  c.fillText("Brew your world, sip your story", px, PC_H-88);
  c.fillStyle = "rgba(251,248,238,.7)"; c.font = "500 25px Anuphan, sans-serif";
  c.fillText(`SAO CAFÉ · IG ${CFG.ig} · LINE ${CFG.line}`, px, PC_H-44);
  c.textAlign = "right"; c.fillStyle = "#FBF8EE"; c.font = "700 44px Anuphan, sans-serif";
  c.fillText(S.type, PC_W-px, PC_H-64);
  c.textAlign = "left";

  return new Promise(res => cv.toBlob(b => res(b), "image/png", .95));
}

        ${S.photoURL ? "เปลี่ยนรูปของคุณ" : "แนบรูปของคุณ"}
      </button>

    }

  };

  bar("เริ่มใหม่สำหรับผู้เรียนคนถัดไป", () => {

      smellI:0,smellScore:0,scent:"",tea:"",sweet:"",top:"",serial:""});
    go("start");
  });
}
